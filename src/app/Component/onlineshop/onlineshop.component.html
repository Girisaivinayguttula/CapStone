<div class="onlineshop-container">
  <header class="header">
    <h2>ONLINE SHOP</h2>
  </header>

  <section class="category-filter">
    <label class="category" for="category">Filter by Category:</label>
    <select class="category" id="category" (change)="filterByCategory($event)">
      <option value="">All</option>
      <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
    </select>
  </section>

  <!-- Skeleton loading cards -->
  <div *ngIf="loading" class="product-list">
    <div class="product-card skeleton" *ngFor="let item of [1,2,3,4,5,6]">
      <div class="skeleton-img"></div>
      <div class="product-info">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line long"></div>
        <div class="skeleton-line short"></div>
        <div class="skeleton-line btn"></div>
      </div>
    </div>
  </div>

  <section class="products">
    <div *ngIf="filteredProducts.length === 0" class="no-products">
      <p class="font">No products available.</p>
    </div>
    <div class="product-list">
      <div *ngFor="let product of filteredProducts" class="product-card">
        <img [src]="product.imageUrl" alt="{{ product.name }}">
        <div class="product-info">
          <span class="category">{{ product.category }}</span>
          <h4>{{ product.name }}</h4>
          <p class="price">${{ product.price }}</p>
          <p class="description">{{ product.description }}</p>

          <div *ngIf="product.quantity > 0; else outOfStock">
            <button (click)="addToCart(product)" [disabled]="isProductInCart(product)">
              {{ isProductInCart(product) ? 'Added to Cart' : 'Add to Cart' }}
            </button>
          </div>
          <ng-template #outOfStock>
            <p class="font">Out of Stock</p>
          </ng-template>
        </div>
      </div>
    </div>
  </section>
</div>
